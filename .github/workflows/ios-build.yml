name: Build iOS IPA (Sideload)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Flutter iOS .ipa
    runs-on: macos-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Remover DEVELOPMENT_TEAM do projeto Xcode
        run: |
          sed -i '' '/DEVELOPMENT_TEAM/d' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' ios/Runner.xcodeproj/project.pbxproj
          echo "✅ Signing removido do projeto"

      - name: Instalar CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS (sem assinatura)
        run: |
          flutter build ios --release --no-codesign || true

      - name: Localizar Runner.app e criar IPA
        run: |
          echo "Buscando Runner.app..."
          APP_PATH=$(find . -name "Runner.app" -type d 2>/dev/null | grep -v "Pods\|Intermediates\|SourcePackages" | head -1)
          
          if [ -z "$APP_PATH" ]; then
            APP_PATH="build/ios/iphoneos/Runner.app"
          fi
          
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Runner.app não encontrado. Estrutura de build:"
            find build -name "*.app" -type d 2>/dev/null | head -10
            exit 1
          fi
          
          echo "✅ App encontrado em: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/Runner.app
          zip -r JenniferFelix.ipa Payload/
          rm -rf Payload/
          echo "✅ IPA criado: $(ls -lh JenniferFelix.ipa)"

      - name: Upload .ipa como artifact
        uses: actions/upload-artifact@v4
        with:
          name: JenniferFelix-iOS-${{ github.sha }}
          path: JenniferFelix.ipa
          retention-days: 30

      - name: Informações do build
        run: |
          echo "✅ Build concluído!"
          echo "📱 Arquivo: JenniferFelix.ipa"
          echo "📥 Baixe em: Actions > Este workflow > Artifacts"
          echo ""
          echo "Instalar via:"
          echo "  AltStore  → https://altstore.io"
          echo "  Sideloadly → https://sideloadly.io"
          ls -lh JenniferFelix.ipa
