workflows:

  # ─────────────────────────────────────────────────────────
  # iOS — Sideload (.ipa sem assinatura, para AltStore)
  # Não requer conta Apple Developer
  # ─────────────────────────────────────────────────────────
  ios-sideload:
    name: iOS IPA (Sideload / AltStore)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: 3.22.0
      xcode: latest
      cocoapods: default
      vars:
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""

    scripts:
      - name: Instalar dependências Flutter
        script: flutter pub get

      - name: Pod install
        script: |
          cd ios && pod install && cd ..

      - name: Build iOS sem assinatura
        script: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            FLUTTER_BUILD_DIR=build \
            FLUTTER_ROOT="$HOME/programs/flutter" \
            -derivedDataPath ios/DerivedData \
            clean build

      - name: Empacotar .ipa
        script: |
          APP_PATH=$(find ios/DerivedData -name "Runner.app" -type d | head -1)
          echo "App encontrado em: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/Runner.app
          zip -r JenniferFelix.ipa Payload/
          rm -rf Payload/
          echo "IPA criado: $(ls -lh JenniferFelix.ipa)"

    artifacts:
      - JenniferFelix.ipa

  # ─────────────────────────────────────────────────────────
  # Android — APK para instalação direta
  # ─────────────────────────────────────────────────────────
  android-apk:
    name: Android APK
    max_build_duration: 45
    instance_type: linux_x2

    environment:
      flutter: 3.22.0
      java: 17

    scripts:
      - name: Instalar dependências Flutter
        script: flutter pub get

      - name: Build APK release
        script: |
          flutter build apk --release --split-per-abi

    artifacts:
      - build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
