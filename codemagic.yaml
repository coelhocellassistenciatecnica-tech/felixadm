workflows:

  # ─────────────────────────────────────────────────────────
  # iOS — Sideload (.ipa sem assinatura, para AltStore)
  # Não requer conta Apple Developer
  # ─────────────────────────────────────────────────────────
  ios-sideload:
    name: iOS IPA (Sideload / AltStore)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: 3.22.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Instalar dependências Flutter
        script: flutter pub get

      - name: Pod install
        script: |
          cd ios && pod install && cd ..

      - name: Build iOS sem assinatura
        script: |
          flutter build ios --release --no-codesign

      - name: Empacotar .ipa
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../JenniferFelix.ipa Payload/
          rm -rf Payload/

    artifacts:
      - JenniferFelix.ipa

  # ─────────────────────────────────────────────────────────
  # Android — APK para instalação direta
  # ─────────────────────────────────────────────────────────
  android-apk:
    name: Android APK
    max_build_duration: 45
    instance_type: linux_x2

    environment:
      flutter: 3.22.0
      java: 17

    scripts:
      - name: Instalar dependências Flutter
        script: flutter pub get

      - name: Build APK release
        script: |
          flutter build apk --release --split-per-abi

    artifacts:
      - build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
